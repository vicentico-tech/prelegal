[project]
name = "prelegal-backend"
version = "0.1.0"
description = "FastAPI backend for the Prelegal platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "bcrypt>=4.2",
    "litellm>=1.55",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.uv]
package = false
